name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release-after-merge.outputs.release_created || steps.release.outputs.release_created }}
      tag_name: ${{ steps.release-after-merge.outputs.tag_name || steps.release.outputs.tag_name }}
      version: ${{ steps.release-after-merge.outputs.version || steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: go
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge release pull request
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          pr_number=$(gh pr list \
            --base main \
            --head release-please--branches--main \
            --state open \
            --json number \
            --jq '.[0].number')

          if [[ -z "$pr_number" ]]; then
            exit 0
          fi

          gh pr merge "$pr_number" --merge
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - uses: googleapis/release-please-action@v4
        id: release-after-merge
        if: steps.merge.outputs.merged == 'true'
        with:
          release-type: go
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          commit=$(git rev-parse HEAD)
          CGO_ENABLED=0 go build \
            -ldflags="-s -w -X main.version=${{ needs.release-please.outputs.version }} -X main.commit=${commit} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o goku-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/goku

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} \
            goku-${{ matrix.goos }}-${{ matrix.goarch }}
