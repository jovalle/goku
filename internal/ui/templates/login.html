<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>
    <script>
      (() => {
        const storageKey = 'goku-theme';
        let theme = 'light';
        try {
          theme =
            localStorage.getItem(storageKey) ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        } catch (err) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-bs-theme', theme);
      })();
    </script>
    <link rel="icon" type="image/png" sizes="256x256" href="/static/favicon.png?v=2" />
    <link rel="shortcut icon" href="/favicon.ico?v=2" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@latest/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light dark;
      }

      .theme-toggle {
        align-items: center;
        background: transparent;
        border: 0;
        border-radius: 0.5rem;
        display: inline-flex;
        flex: 0 0 2.75rem;
        height: 2.5rem;
        justify-content: center;
        padding: 0;
        width: 2.75rem;
      }

      .theme-toggle:hover {
        opacity: 0.8;
      }

      .theme-toggle:focus-visible {
        box-shadow: 0 0 0 0.25rem rgba(var(--bs-primary-rgb), 0.25);
        outline: 0;
      }

      .theme-toggle img {
        height: 2.5rem;
        width: 2.5rem;
      }

      .theme-toggle .theme-logo-dark {
        display: none;
      }

      [data-bs-theme='dark'] .theme-toggle .theme-logo-light {
        display: none;
      }

      [data-bs-theme='dark'] .theme-toggle .theme-logo-dark {
        display: block;
      }
    </style>
  </head>
  <body class="bg-body-tertiary">
    <main class="container min-vh-100 d-flex align-items-center py-3">
      <div class="row justify-content-center w-100">
        <section class="col-12 col-sm-10 col-md-5 col-lg-4">
          <div class="card shadow-sm">
            <div class="card-body p-3 p-md-4">
              <div class="d-flex align-items-center gap-2 mb-3">
                <button
                  type="button"
                  class="theme-toggle"
                  data-theme-toggle
                  aria-label="Switch to dark mode"
                  title="Switch to dark mode"
                >
                  <img class="theme-logo-light" src="/static/logo.png" alt="" width="40" height="40" />
                  <img class="theme-logo-dark" src="/static/logo-dark.png" alt="" width="40" height="40" />
                </button>
                <h1 class="h4 mb-0">Goku</h1>
              </div>
              <form
                method="post"
                action="/login"
                id="login-form"
                novalidate
                data-state="{{ if .Invalid }}invalid{{ else }}idle{{ end }}"
              >
                <div class="d-flex align-items-start gap-2">
                  <div class="flex-grow-1">
                    <input
                      id="password"
                      name="password"
                      type="password"
                      class="form-control"
                      placeholder="Password"
                      autocomplete="current-password"
                      required
                      minlength="1"
                      autofocus
                    />
                    <div class="invalid-feedback">Password is required.</div>
                    {{ if .Invalid }}
                    <div class="invalid-feedback d-block">Wrong password.</div>
                    {{ end }}
                  </div>
                  <button type="submit" class="btn btn-primary text-nowrap">Log in</button>
                </div>

                <div class="mt-3 d-flex justify-content-center">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="remember" id="remember" />
                    <label class="form-check-label" for="remember">Keep me logged in</label>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </section>
      </div>
    </main>
    <script>
      (() => {
        const storageKey = 'goku-theme';

        function currentTheme() {
          return document.documentElement.getAttribute('data-bs-theme') || 'light';
        }

        function paintThemeToggle(toggle) {
          const isDark = currentTheme() === 'dark';
          const label = isDark ? 'Switch to light mode' : 'Switch to dark mode';
          toggle.setAttribute('aria-label', label);
          toggle.setAttribute('title', label);
        }

        function setTheme(theme) {
          document.documentElement.setAttribute('data-bs-theme', theme);
          try {
            localStorage.setItem(storageKey, theme);
          } catch (err) {}
          document.querySelectorAll('[data-theme-toggle]').forEach(paintThemeToggle);
        }

        document.querySelectorAll('[data-theme-toggle]').forEach((toggle) => {
          paintThemeToggle(toggle);
          toggle.addEventListener('click', () => {
            setTheme(currentTheme() === 'dark' ? 'light' : 'dark');
          });
        });
      })();

      const form = document.getElementById('login-form');
      const password = document.getElementById('password');

      form.addEventListener('submit', (event) => {
        if (!password.checkValidity()) {
          event.preventDefault();
          event.stopPropagation();
          password.classList.add('is-invalid');
          return;
        }

        password.classList.remove('is-invalid');
      });

      password.addEventListener('input', () => {
        if (password.checkValidity()) {
          password.classList.remove('is-invalid');
        }
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@latest/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
